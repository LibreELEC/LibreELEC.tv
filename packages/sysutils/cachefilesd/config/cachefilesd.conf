# Configuration for cachefilesd, the local disk cache for network filesystems.
#
# Nothing is cached until a filesystem is mounted with the "fsc" option, e.g.
# adding "Options=fsc" to an NFS .mount unit in /storage/.config/system.d.
#
# See "man 5 cachefilesd.conf" for the full syntax. After editing, run
# "systemctl restart cachefilesd" to apply the changes.

# Where the cache is stored. Must be on a filesystem with extended attribute
# support (the ext4 /storage partition qualifies) - never point this at a
# tmpfs such as /var or /run.
dir /storage/.cache/fscache

# Name this cache is known by in /proc/fs/fscache.
tag libreelec

# Free space limits, as a percentage of the filesystem holding the cache.
# Culling of old cache data starts when free space drops below "bcull" and
# runs until it is back above "brun"; caching stops entirely below "bstop".
# These are deliberately more conservative than the cachefilesd defaults so
# that a small eMMC or SD card keeps room for Kodi's own data.
brun 20%
bcull 15%
bstop 10%

# The same limits for free inodes.
frun 20%
fcull 15%
fstop 10%
