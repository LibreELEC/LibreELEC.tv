#
# Configuration for HDMI
#

<confdir:pcm/hdmi.conf>

# The HDMI controller can only take non-linear audio as IEC958 subframes,
# which carry the channel status with every sample, but those only hold a
# 16 bit payload. Convert to subframes in software when AES0 marks the
# stream as non-audio and pass linear PCM straight through otherwise.
# ALSA configuration can't test bits, so the non-audio values are listed.
sunxi-hdmi.aes0.2 "iec958"	# IEC958_AES0_NONAUDIO
sunxi-hdmi.aes0.6 "iec958"	# IEC958_AES0_NONAUDIO | IEC958_AES0_CON_NOT_COPYRIGHT

sunxi-hdmi.pcm.hdmi."sunxi-hdmi" {
	@args [ CARD DEVICE AES0 AES1 AES2 AES3 ]
	@args.CARD { type string }
	@args.DEVICE { type integer }
	@args.AES0 { type integer }
	@args.AES1 { type integer }
	@args.AES2 { type integer }
	@args.AES3 { type integer }

	@func refer
	name {
		@func concat
		strings [
			"cards.sunxi-hdmi.pcm."
			{
				@func refer
				name {
					@func concat
					strings [ "cards.sunxi-hdmi.aes0." $AES0 ]
				}
				default "pcm"
			}
			":CARD=" $CARD ","
			"DEVICE=" $DEVICE ","
			"AES0=" $AES0 ","
			"AES1=" $AES1 ","
			"AES2=" $AES2 ","
			"AES3=" $AES3
		]
	}
}

sunxi-hdmi.pcm.pcm {
	@args [ CARD DEVICE AES0 AES1 AES2 AES3 ]
	@args.CARD { type string }
	@args.DEVICE { type integer }
	@args.AES0 { type integer }
	@args.AES1 { type integer }
	@args.AES2 { type integer }
	@args.AES3 { type integer }
	type hooks
	slave.pcm {
		type hw
		card $CARD
		device $DEVICE
	}
	hooks.0 {
		type ctl_elems
		hook_args [
			{
				interface PCM
				name "IEC958 Playback Default"
				lock true
				preserve true
				optional true
				value [ $AES0 $AES1 $AES2 $AES3 ]
			}
		]
	}
	hint.device $DEVICE
}

sunxi-hdmi.pcm.iec958 {
	@args [ CARD DEVICE AES0 AES1 AES2 AES3 ]
	@args.CARD { type string }
	@args.DEVICE { type integer }
	@args.AES0 { type integer }
	@args.AES1 { type integer }
	@args.AES2 { type integer }
	@args.AES3 { type integer }
	type iec958
	slave {
		format IEC958_SUBFRAME_LE
		pcm {
			@func refer
			name {
				@func concat
				strings [
					"cards.sunxi-hdmi.pcm.pcm:"
					"CARD=" $CARD ","
					"DEVICE=" $DEVICE ","
					"AES0=" $AES0 ","
					"AES1=" $AES1 ","
					"AES2=" $AES2 ","
					"AES3=" $AES3
				]
			}
		}
	}
	status [ $AES0 $AES1 $AES2 $AES3 ]
	hdmi_mode true
	hint.device $DEVICE
}

sunxi-hdmi.pcm.hdmi.0 {
	@args [ CARD AES0 AES1 AES2 AES3 ]
	@args.CARD { type string }
	@args.AES0 { type integer }
	@args.AES1 { type integer }
	@args.AES2 { type integer }
	@args.AES3 { type integer }

	@func refer
	name {
		@func concat
		strings [
			"cards.sunxi-hdmi.pcm.hdmi."
			{ @func card_name card $CARD }
			":CARD=" $CARD ","
			"DEVICE=0,"
			"AES0=" $AES0 ","
			"AES1=" $AES1 ","
			"AES2=" $AES2 ","
			"AES3=" $AES3
		]
	}
	default {
		# point to non-existent device
		card $CARD
		device 999
		hint.device 999
	}

}
