#
# Configuration for HDMI on the MediaTek MT8195/MT8395 sof-mt8395-evk card.
# HDMI is PCM device 5 (DL10); the UCM boot sequence sets the routes.
# The hardware advertises S24_LE but treats it as MSB-aligned 32-bit
# (24-bit samples come out ~48 dB too quiet), so always feed it S32_LE.
#

<confdir:pcm/hdmi.conf>

sof-mt8395-evk.pcm.hdmi.0 {
	@args [ CARD AES0 AES1 AES2 AES3 ]
	@args.CARD { type string }
	@args.AES0 { type integer }
	@args.AES1 { type integer }
	@args.AES2 { type integer }
	@args.AES3 { type integer }
	type linear
	slave {
		pcm {
			type hw
			card $CARD
			device 5
		}
		format S32_LE
	}
}
